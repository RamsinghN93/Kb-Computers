<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.workers.dev; img-src 'self' data:;">
  <title>KB Computers – Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    h2 { font-size: 1.15rem; margin: 20px 0 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
    input, select, button, textarea {
      font: inherit;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 100%;
      margin-top: 4px;
    }
    button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 12px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--border); }
    button.danger { background: var(--danger); }
    button.small { width: auto; padding: 6px 12px; margin: 0; font-size: 0.85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 120px; }
    .hidden { display: none !important; }
    .msg { padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; }
    .msg.error { background: #7f1d1d; color: #fecaca; }
    .msg.success { background: #14532d; color: #bbf7d0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.pending { background: #422006; color: #fbbf24; }
    .badge.progress { background: #1e3a5f; color: #60a5fa; }
    .badge.ready { background: #14532d; color: #4ade80; }
    .badge.done { background: #1e293b; color: #94a3b8; }
    .badge.cancel { background: #450a0a; color: #f87171; }
    #loginBox { max-width: 360px; margin: 60px auto; }
    .small { font-size: 0.85rem; color: var(--muted); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .icon-preview { font-size: 1.6rem; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="container">

    <!-- LOGIN -->
    <div id="loginBox" class="card">
      <h1>Admin Login</h1>
      <p class="small">KB Computers – Secure Admin Panel</p>
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
      <button id="loginBtn">Login</button>
      <div id="loginMsg" class="msg hidden"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
      <div class="row" style="align-items:center; margin-bottom:12px;">
        <h1 style="flex:1;">KB Admin</h1>
        <button class="secondary small" id="logoutBtn">Logout</button>
      </div>

      <!-- ADD / EDIT PRODUCT -->
      <div class="card">
        <h2 id="formTitle">Add New Product</h2>
        <div id="productMsg" class="msg hidden"></div>

        <div class="form-grid">
          <div>
            <label>Product ID (unique)</label>
            <input id="pId" placeholder="e.g. p5" maxlength="20">
          </div>
          <div>
            <label>Name</label>
            <input id="pName" placeholder="Product name" maxlength="100">
          </div>
          <div>
            <label>Price (₹)</label>
            <input id="pPrice" type="number" min="0" placeholder="0">
          </div>
          <div>
            <label>Stock</label>
            <input id="pStock" type="number" min="0" placeholder="0">
          </div>
          <div>
            <label>Icon (emoji or text)</label>
            <div class="row" style="align-items:center;">
              <input id="pIcon" placeholder="🧠 or SSD" maxlength="10" style="flex:1;">
              <span class="icon-preview" id="iconPreview"></span>
            </div>
          </div>
          <div>
            <label>Tag</label>
            <input id="pTag" placeholder="Popular / Fast / Value" maxlength="30">
          </div>
        </div>

        <div class="row" style="margin-top:12px;">
          <button id="saveProductBtn">Save Product</button>
          <button class="secondary" id="clearFormBtn">Clear Form</button>
        </div>
      </div>

      <!-- PRODUCT LIST -->
      <div class="card">
        <h2>All Products</h2>
        <div id="stockMsg" class="msg hidden"></div>
        <div id="stockTable"></div>
      </div>

      <!-- REPAIRS -->
      <div class="card">
        <h2>Repair Calls</h2>
        <div id="repairMsg" class="msg hidden"></div>
        <div id="repairTable"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://kb-computers-api.nramsingh93.workers.dev";
    let adminPass = "";
    let editingId = null;

    const $ = (id) => document.getElementById(id);

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg " + type;
      el.classList.remove("hidden");
    }
    function hideMsg(el) { el.classList.add("hidden"); }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function api(path, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        "X-Admin-Password": adminPass,
        ...(options.headers || {})
      };
      const res = await fetch(API_BASE + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    // LOGIN
    $("loginBtn").onclick = async () => {
      const pass = $("password").value.trim();
      if (!pass) return showMsg($("loginMsg"), "Enter password", "error");
      adminPass = pass;
      try {
        await api("/admin/products");
        $("loginBox").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        loadProducts();
        loadRepairs();
      } catch (e) {
        adminPass = "";
        showMsg($("loginMsg"), "Wrong password", "error");
      }
    };
    $("password").onkeydown = (e) => { if (e.key === "Enter") $("loginBtn").click(); };

    $("logoutBtn").onclick = () => {
      adminPass = "";
      $("dashboard").classList.add("hidden");
      $("loginBox").classList.remove("hidden");
      $("password").value = "";
      hideMsg($("loginMsg"));
      clearForm();
    };

    // ICON PREVIEW
    $("pIcon").oninput = () => {
      $("iconPreview").textContent = $("pIcon").value;
    };

    // CLEAR FORM
    function clearForm() {
      editingId = null;
      $("formTitle").textContent = "Add New Product";
      $("pId").value = "";
      $("pId").disabled = false;
      $("pName").value = "";
      $("pPrice").value = "";
      $("pStock").value = "";
      $("pIcon").value = "";
      $("pTag").value = "";
      $("iconPreview").textContent = "";
      hideMsg($("productMsg"));
    }
    $("clearFormBtn").onclick = clearForm;

    // SAVE PRODUCT (Add or Update)
    $("saveProductBtn").onclick = async () => {
      const id = $("pId").value.trim();
      const name = $("pName").value.trim();
      const price = parseInt($("pPrice").value, 10) || 0;
      const stock = parseInt($("pStock").value, 10) || 0;
      const icon = $("pIcon").value.trim();
      const tag = $("pTag").value.trim();

      if (!id || id.length < 2) return showMsg($("productMsg"), "Enter valid Product ID", "error");
      if (!name || name.length < 2) return showMsg($("productMsg"), "Enter product name", "error");

      try {
        await api("/admin/product", {
          method: "POST",
          body: JSON.stringify({ id, name, price, icon, tag, stock })
        });
        showMsg($("productMsg"), editingId ? "Product updated" : "Product added", "success");
        clearForm();
        loadProducts();
        setTimeout(() => hideMsg($("productMsg")), 2500);
      } catch (e) {
        showMsg($("productMsg"), e.message, "error");
      }
    };

    // LOAD PRODUCTS
    async function loadProducts() {
      try {
        const products = await api("/admin/products");
        if (!products.length) {
          $("stockTable").textContent = "No products yet.";
          return;
        }

        let html = `<table><thead><tr>
          <th>Icon</th><th>Name</th><th>Price</th><th>Stock</th><th>Tag</th><th>Actions</th>
        </tr></thead><tbody>`;

        for (const p of products) {
          html += `<tr>
            <td style="font-size:1.3rem;">${escapeHtml(p.icon || "📦")}</td>
            <td>${escapeHtml(p.name)}<br><span class="small">${escapeHtml(p.id)}</span></td>
            <td>₹${p.price}</td>
            <td>${p.stock}</td>
            <td>${escapeHtml(p.tag || "-")}</td>
            <td>
              <button class="small" data-edit="${escapeHtml(p.id)}">Edit</button>
              <button class="small danger" data-del="${escapeHtml(p.id)}">Del</button>
            </td>
          </tr>`;
        }
        html += `</tbody></table>`;
        $("stockTable").innerHTML = html;

        // Edit buttons
        $("stockTable").querySelectorAll("[data-edit]").forEach(btn => {
          btn.onclick = () => {
            const p = products.find(x => x.id === btn.dataset.edit);
            if (!p) return;
            editingId = p.id;
            $("formTitle").textContent = "Edit Product";
            $("pId").value = p.id;
            $("pId").disabled = true;
            $("pName").value = p.name;
            $("pPrice").value = p.price;
            $("pStock").value = p.stock;
            $("pIcon").value = p.icon || "";
            $("pTag").value = p.tag || "";
            $("iconPreview").textContent = p.icon || "";
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
        });

        // Delete buttons
        $("stockTable").querySelectorAll("[data-del]").forEach(btn => {
          btn.onclick = async () => {
            if (!confirm("Delete this product?")) return;
            try {
              await api("/admin/product/delete", {
                method: "POST",
                body: JSON.stringify({ id: btn.dataset.del })
              });
              showMsg($("stockMsg"), "Product deleted", "success");
              loadProducts();
              setTimeout(() => hideMsg($("stockMsg")), 2000);
            } catch (e) {
              showMsg($("stockMsg"), e.message, "error");
            }
          };
        });
      } catch (e) {
        showMsg($("stockMsg"), e.message, "error");
      }
    }

    // REPAIRS
    async function loadRepairs() {
      try {
        const repairs = await api("/admin/repairs");
        if (!repairs.length) {
          $("repairTable").textContent = "No repair calls yet.";
          return;
        }

        let html = `<table><thead><tr>
          <th>ID</th><th>Customer</th><th>Device</th><th>Status</th><th>Change</th>
        </tr></thead><tbody>`;

        for (const r of repairs) {
          const badgeClass = {
            "Awaiting Accessories": "pending",
            "In Progress": "progress",
            "Ready for Pickup": "ready",
            "Completed": "done",
            "Cancelled": "cancel"
          }[r.status] || "pending";

          html += `<tr>
            <td class="small">${escapeHtml(r.id)}</td>
            <td>${escapeHtml(r.name)}<br><span class="small">${escapeHtml(r.phone)}</span></td>
            <td>${escapeHtml(r.device)}<br><span class="small">${escapeHtml(r.priority)}</span></td>
            <td><span class="badge ${badgeClass}">${escapeHtml(r.status)}</span></td>
            <td>
              <select data-id="${escapeHtml(r.id)}" style="width:auto;min-width:140px;padding:6px;">
                <option value="Awaiting Accessories">Awaiting Accessories</option>
                <option value="In Progress">In Progress</option>
                <option value="Ready for Pickup">Ready for Pickup</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </td>
          </tr>`;
        }
        html += `</tbody></table>`;
        $("repairTable").innerHTML = html;

        $("repairTable").querySelectorAll("select").forEach(sel => {
          const row = repairs.find(r => r.id === sel.dataset.id);
          if (row) sel.value = row.status;

          sel.onchange = async () => {
            try {
              await api("/admin/status", {
                method: "POST",
                body: JSON.stringify({ id: sel.dataset.id, status: sel.value })
              });
              showMsg($("repairMsg"), "Status updated", "success");
              setTimeout(() => hideMsg($("repairMsg")), 2000);
              loadRepairs();
            } catch (e) {
              showMsg($("repairMsg"), e.message, "error");
            }
          };
        });
      } catch (e) {
        showMsg($("repairMsg"), e.message, "error");
      }
    }
  </script>
</body>
</html>
