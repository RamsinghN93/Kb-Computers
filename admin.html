<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.workers.dev; img-src 'self' data:;">
  <title>KB Computers – Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    h2 { font-size: 1.15rem; margin: 20px 0 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
    input, select, button, textarea {
      font: inherit;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 100%;
      margin-top: 4px;
    }
    button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 12px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--border); }
    button.danger { background: var(--danger); }
    button.small { width: auto; padding: 6px 12px; margin: 0; font-size: 0.85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 120px; }
    .hidden { display: none !important; }
    .msg { padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; }
    .msg.error { background: #7f1d1d; color: #fecaca; }
    .msg.success { background: #14532d; color: #bbf7d0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.pending { background: #422006; color: #fbbf24; }
    .badge.progress { background: #1e3a5f; color: #60a5fa; }
    .badge.ready { background: #14532d; color: #4ade80; }
    .badge.done { background: #1e293b; color: #94a3b8; }
    .badge.cancel { background: #450a0a; color: #f87171; }
    #loginBox { max-width: 360px; margin: 60px auto; }
    .small { font-size: 0.85rem; color: var(--muted); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .icon-preview { font-size: 1.6rem; margin-left: 8px; }
  
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{background:linear-gradient(135deg,#172554,#1e293b);border:1px solid var(--border,#334155);border-radius:12px;padding:16px;color:#fff}.stat .num{font-size:1.55rem;font-weight:800}.stat .label{margin-top:2px;color:#cbd5e1;font-size:.82rem}.tool-row{display:flex;gap:10px;flex-wrap:wrap}.tool-row>*{flex:1;min-width:180px}.file-input{display:none}.hint{margin-top:8px;font-size:.8rem;color:var(--muted,#64748b)}@media(max-width:600px){.stat-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="container">

    <!-- LOGIN -->
    <div id="loginBox" class="card">
      <h1>Admin Login</h1>
      <p class="small">KB Computers – Secure Admin Panel</p>
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
      <button id="loginBtn">Login</button>
      <div id="loginMsg" class="msg hidden"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
      <div class="row" style="align-items:center; margin-bottom:12px;">
        <h1 style="flex:1;">KB Admin</h1>
        <button class="secondary small" id="logoutBtn">Logout</button>
      </div>

      <div class="stat-grid">
        <div class="stat"><div class="num" id="statProducts">0</div><div class="label">Total Products</div></div>
        <div class="stat"><div class="num" id="statStock">0</div><div class="label">Units In Stock</div></div>
        <div class="stat"><div class="num" id="statLow">0</div><div class="label">Low / Out of Stock</div></div>
      </div>

      <div class="card">
        <h2 style="margin-top:0;">Product Tools</h2>
        <div class="tool-row">
          <button id="exportCsvBtn" class="secondary">⬇ Export Products CSV</button>
          <button id="importCsvBtn">⬆ Import Products CSV</button>
          <input id="csvFile" class="file-input" type="file" accept=".csv,text/csv">
        </div>
        <div class="hint">CSV columns: id, name, price, stock, icon, tag. Existing product IDs are updated; new IDs are added.</div>
        <div id="importMsg" class="msg hidden"></div>
      </div>

      <!-- ADD / EDIT PRODUCT -->
      <div class="card">
        <h2 id="formTitle">Add New Product</h2>
        <div id="productMsg" class="msg hidden"></div>

        <div class="form-grid">
          <div>
            <label>Product ID (unique)</label>
            <input id="pId" placeholder="e.g. p5" maxlength="20">
          </div>
          <div>
            <label>Name</label>
            <input id="pName" placeholder="Product name" maxlength="100">
          </div>
          <div>
            <label>Price (₹)</label>
            <input id="pPrice" type="number" min="0" placeholder="0">
          </div>
          <div>
            <label>Stock</label>
            <input id="pStock" type="number" min="0" placeholder="0">
          </div>
          <div>
            <label>Icon (emoji or text)</label>
            <div class="row" style="align-items:center;">
              <input id="pIcon" placeholder="🧠 or SSD" maxlength="10" style="flex:1;">
              <span class="icon-preview" id="iconPreview"></span>
            </div>
          </div>
          <div>
            <label>Tag</label>
            <input id="pTag" placeholder="Popular / Fast / Value" maxlength="30">
          </div>
        </div>

        <div class="row" style="margin-top:12px;">
          <button id="saveProductBtn">Save Product</button>
          <button class="secondary" id="clearFormBtn">Clear Form</button>
        </div>
      </div>

      <!-- PRODUCT LIST -->
      <div class="card">
        <h2>All Products</h2>
        <div class="tool-row" style="margin-bottom:12px;">
          <input id="productSearch" type="search" placeholder="🔎 Search name, ID or tag..." autocomplete="off">
          <select id="productStockFilter"><option value="all">All stock</option><option value="in">In stock</option><option value="low">Low stock (1–3)</option><option value="out">Out of stock</option></select>
        </div>
        <div id="stockMsg" class="msg hidden"></div>
        <div id="stockTable"></div>
      </div>

      <!-- REPAIRS -->
      <div class="card">
        <h2>Repair Calls</h2>
        <div id="repairMsg" class="msg hidden"></div>
        <div id="repairTable"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://kb-computers-api.nramsingh93.workers.dev";
    let adminPass = "";
    let editingId = null;

    const $ = (id) => document.getElementById(id);

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg " + type;
      el.classList.remove("hidden");
    }
    function hideMsg(el) { el.classList.add("hidden"); }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function api(path, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        "X-Admin-Password": adminPass,
        ...(options.headers || {})
      };
      const res = await fetch(API_BASE + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    // LOGIN
    $("loginBtn").onclick = async () => {
      const pass = $("password").value.trim();
      if (!pass) return showMsg($("loginMsg"), "Enter password", "error");
      adminPass = pass;
      try {
        await api("/admin/products");
        $("loginBox").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        loadProducts();
        loadRepairs();
      } catch (e) {
        adminPass = "";
        showMsg($("loginMsg"), "Wrong password", "error");
      }
    };
    $("password").onkeydown = (e) => { if (e.key === "Enter") $("loginBtn").click(); };

    $("logoutBtn").onclick = () => {
      adminPass = "";
      $("dashboard").classList.add("hidden");
      $("loginBox").classList.remove("hidden");
      $("password").value = "";
      hideMsg($("loginMsg"));
      clearForm();
    };

    // ICON PREVIEW
    $("pIcon").oninput = () => {
      $("iconPreview").textContent = $("pIcon").value;
    };

    // CLEAR FORM
    function clearForm() {
      editingId = null;
      $("formTitle").textContent = "Add New Product";
      $("pId").value = "";
      $("pId").disabled = false;
      $("pName").value = "";
      $("pPrice").value = "";
      $("pStock").value = "";
      $("pIcon").value = "";
      $("pTag").value = "";
      $("iconPreview").textContent = "";
      hideMsg($("productMsg"));
    }
    $("clearFormBtn").onclick = clearForm;

    // SAVE PRODUCT (Add or Update)
    $("saveProductBtn").onclick = async () => {
      const id = $("pId").value.trim();
      const name = $("pName").value.trim();
      const price = parseInt($("pPrice").value, 10) || 0;
      const stock = parseInt($("pStock").value, 10) || 0;
      const icon = $("pIcon").value.trim();
      const tag = $("pTag").value.trim();

      if (!id || id.length < 2) return showMsg($("productMsg"), "Enter valid Product ID", "error");
      if (!name || name.length < 2) return showMsg($("productMsg"), "Enter product name", "error");

      try {
        await api("/admin/product", {
          method: "POST",
          body: JSON.stringify({ id, name, price, icon, tag, stock })
        });
        showMsg($("productMsg"), editingId ? "Product updated" : "Product added", "success");
        clearForm();
        loadProducts();
        setTimeout(() => hideMsg($("productMsg")), 2500);
      } catch (e) {
        showMsg($("productMsg"), e.message, "error");
      }
    };

    let allProducts = [];
    function setDashboardStats() {
      $("statProducts").textContent = allProducts.length;
      $("statStock").textContent = allProducts.reduce((sum,p)=>sum+(Number(p.stock)||0),0);
      $("statLow").textContent = allProducts.filter(p=>(Number(p.stock)||0)<=3).length;
    }
    function filterProducts() {
      const q = $("productSearch").value.trim().toLowerCase();
      const f = $("productStockFilter").value;
      const filtered = allProducts.filter(p => {
        const text = [p.name,p.id,p.tag].map(v=>String(v||"").toLowerCase()).join(" ");
        const stock = Number(p.stock)||0;
        return (!q || text.includes(q)) && (f==="all" || (f==="in"&&stock>3) || (f==="low"&&stock>0&&stock<=3) || (f==="out"&&stock<=0));
      });
      renderProductTable(filtered);
    }
    function renderProductTable(products) {
      if (!products.length) { $("stockTable").textContent="No matching products."; return; }
      let html=`<table><thead><tr><th>Icon</th><th>Name</th><th>Price</th><th>Stock</th><th>Tag</th><th>Actions</th></tr></thead><tbody>`;
      for(const p of products){html+=`<tr><td style="font-size:1.3rem;">${escapeHtml(p.icon||"📦")}</td><td>${escapeHtml(p.name)}<br><span class="small">${escapeHtml(p.id)}</span></td><td>₹${p.price}</td><td>${p.stock}</td><td>${escapeHtml(p.tag||"-")}</td><td><button class="small" data-edit="${escapeHtml(p.id)}">Edit</button> <button class="small danger" data-del="${escapeHtml(p.id)}">Del</button></td></tr>`;}
      html+=`</tbody></table>`; $("stockTable").innerHTML=html;
      $("stockTable").querySelectorAll("[data-edit]").forEach(btn=>btn.onclick=()=>{const p=allProducts.find(x=>x.id===btn.dataset.edit);if(!p)return;editingId=p.id;$("formTitle").textContent="Edit Product";$("pId").value=p.id;$("pId").disabled=true;$("pName").value=p.name;$("pPrice").value=p.price;$("pStock").value=p.stock;$("pIcon").value=p.icon||"";$("pTag").value=p.tag||"";$("iconPreview").textContent=p.icon||"";window.scrollTo({top:0,behavior:"smooth"});});
      $("stockTable").querySelectorAll("[data-del]").forEach(btn=>btn.onclick=async()=>{if(!confirm("Delete this product?"))return;try{await api("/admin/product/delete",{method:"POST",body:JSON.stringify({id:btn.dataset.del})});showMsg($("stockMsg"),"Product deleted","success");await loadProducts();setTimeout(()=>hideMsg($("stockMsg")),2000)}catch(e){showMsg($("stockMsg"),e.message,"error")}});
    }
    async function loadProducts() {
      try { allProducts=await api("/admin/products"); setDashboardStats(); filterProducts(); }
      catch(e){showMsg($("stockMsg"),e.message,"error");}
    }
    $("productSearch").oninput=filterProducts; $("productStockFilter").onchange=filterProducts;
    function csvCell(v){return '"'+String(v??"").replace(/"/g,'""')+'"';}
    function exportProductsCsv(){const lines=[["id","name","price","stock","icon","tag"],...allProducts.map(p=>[p.id,p.name,p.price,p.stock,p.icon||"",p.tag||""])].map(r=>r.map(csvCell).join(","));const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kb-computers-products.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    function parseCsv(text){const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=""}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
    async function importProductsCsv(file){const rows=parseCsv(await file.text());if(rows.length<2)throw Error("CSV has no product rows.");const h=rows[0].map(x=>x.trim().toLowerCase());for(const k of ["id","name","price","stock"])if(!h.includes(k))throw Error("Missing CSV column: "+k);const idx=k=>h.indexOf(k);let n=0;for(const r of rows.slice(1)){const id=(r[idx("id")]||"").trim(),name=(r[idx("name")]||"").trim();if(!id||!name)continue;await api("/admin/product",{method:"POST",body:JSON.stringify({id,name,price:parseInt(r[idx("price")]||"0",10)||0,stock:parseInt(r[idx("stock")]||"0",10)||0,icon:h.includes("icon")?(r[idx("icon")]||"").trim():"",tag:h.includes("tag")?(r[idx("tag")]||"").trim():""})});n++}return n}
    $("exportCsvBtn").onclick=exportProductsCsv; $("importCsvBtn").onclick=()=>$("csvFile").click();
    $("csvFile").onchange=async()=>{const f=$("csvFile").files[0];if(!f)return;try{const n=await importProductsCsv(f);showMsg($("importMsg"),`Import complete: ${n} product(s) processed.` ,"success");await loadProducts()}catch(e){showMsg($("importMsg"),e.message,"error")}$("csvFile").value=""};

    // REPAIRS
    async function loadRepairs() {
      try {
        const repairs = await api("/admin/repairs");
        if (!repairs.length) {
          $("repairTable").textContent = "No repair calls yet.";
          return;
        }

        let html = `<table><thead><tr>
          <th>ID</th><th>Customer</th><th>Device</th><th>Status</th><th>Change</th>
        </tr></thead><tbody>`;

        for (const r of repairs) {
          const badgeClass = {
            "Awaiting Accessories": "pending",
            "In Progress": "progress",
            "Ready for Pickup": "ready",
            "Completed": "done",
            "Cancelled": "cancel"
          }[r.status] || "pending";

          html += `<tr>
            <td class="small">${escapeHtml(r.id)}</td>
            <td>${escapeHtml(r.name)}<br><span class="small">${escapeHtml(r.phone)}</span></td>
            <td>${escapeHtml(r.device)}<br><span class="small">${escapeHtml(r.priority)}</span></td>
            <td><span class="badge ${badgeClass}">${escapeHtml(r.status)}</span></td>
            <td>
              <select data-id="${escapeHtml(r.id)}" style="width:auto;min-width:140px;padding:6px;">
                <option value="Awaiting Accessories">Awaiting Accessories</option>
                <option value="In Progress">In Progress</option>
                <option value="Ready for Pickup">Ready for Pickup</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </td>
          </tr>`;
        }
        html += `</tbody></table>`;
        $("repairTable").innerHTML = html;

        $("repairTable").querySelectorAll("select").forEach(sel => {
          const row = repairs.find(r => r.id === sel.dataset.id);
          if (row) sel.value = row.status;

          sel.onchange = async () => {
            let reason = "";
            if (sel.value === "Cancelled") {
              reason = prompt("Please enter reason for cancellation:");
              if (!reason || reason.trim().length < 3) {
                showMsg($("repairMsg"), "Cancellation requires a reason", "error");
                loadRepairs(); // reset select
                return;
              }
            }
            try {
              await api("/admin/status", {
                method: "POST",
                body: JSON.stringify({ id: sel.dataset.id, status: sel.value, reason: reason })
              });
              showMsg($("repairMsg"), "Status updated", "success");
              setTimeout(() => hideMsg($("repairMsg")), 2000);
              loadRepairs();
            } catch (e) {
              showMsg($("repairMsg"), e.message, "error");
              loadRepairs();
            }
          };
        });
      } catch (e) {
        showMsg($("repairMsg"), e.message, "error");
      }
    }
  </script>
</body>
</html>
