<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.workers.dev; img-src 'self' data:;">
  <title>KB Computers – Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    h2 { font-size: 1.2rem; margin: 24px 0 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    input, select, button {
      font: inherit;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 100%;
      margin-top: 6px;
    }
    button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 12px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--border); }
    button.danger { background: var(--danger); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 120px; }
    .hidden { display: none !important; }
    .msg { padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; }
    .msg.error { background: #7f1d1d; color: #fecaca; }
    .msg.success { background: #14532d; color: #bbf7d0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.pending { background: #422006; color: #fbbf24; }
    .badge.progress { background: #1e3a5f; color: #60a5fa; }
    .badge.ready { background: #14532d; color: #4ade80; }
    .badge.done { background: #1e293b; color: #94a3b8; }
    .badge.cancel { background: #450a0a; color: #f87171; }
    .stock-input { width: 80px; }
    #loginBox { max-width: 360px; margin: 60px auto; }
    .small { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">

    <!-- LOGIN -->
    <div id="loginBox" class="card">
      <h1>Admin Login</h1>
      <p class="small">KB Computers – Secure Admin Panel</p>
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
      <button id="loginBtn">Login</button>
      <div id="loginMsg" class="msg hidden"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
      <div class="row" style="align-items:center; margin-bottom:16px;">
        <h1 style="flex:1;">KB Admin</h1>
        <button class="secondary" id="logoutBtn" style="width:auto;">Logout</button>
      </div>

      <!-- STOCK -->
      <div class="card">
        <h2>Product Stock</h2>
        <div id="stockMsg" class="msg hidden"></div>
        <div id="stockTable"></div>
      </div>

      <!-- REPAIRS -->
      <div class="card">
        <h2>Repair Calls</h2>
        <div id="repairMsg" class="msg hidden"></div>
        <div id="repairTable"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://kb-computers-api.nramsingh93.workers.dev";
    let adminPass = "";

    const $ = (id) => document.getElementById(id);

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg " + type;
      el.classList.remove("hidden");
    }

    function hideMsg(el) {
      el.classList.add("hidden");
    }

    async function api(path, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        "X-Admin-Password": adminPass,
        ...(options.headers || {})
      };
      const res = await fetch(API_BASE + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    // LOGIN
    $("loginBtn").onclick = async () => {
      const pass = $("password").value.trim();
      if (!pass) return showMsg($("loginMsg"), "Enter password", "error");

      adminPass = pass;
      try {
        await api("/admin/products");
        $("loginBox").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        loadStock();
        loadRepairs();
      } catch (e) {
        adminPass = "";
        showMsg($("loginMsg"), "Wrong password", "error");
      }
    };

    $("password").onkeydown = (e) => {
      if (e.key === "Enter") $("loginBtn").click();
    };

    $("logoutBtn").onclick = () => {
      adminPass = "";
      $("dashboard").classList.add("hidden");
      $("loginBox").classList.remove("hidden");
      $("password").value = "";
      hideMsg($("loginMsg"));
    };

    // STOCK
    async function loadStock() {
      try {
        const products = await api("/admin/products");
        let html = `<table><thead><tr><th>Product</th><th>Stock</th><th>Action</th></tr></thead><tbody>`;
        for (const p of products) {
          html += `<tr>
            <td>${escapeHtml(p.name)}</td>
            <td><input class="stock-input" type="number" min="0" max="9999" value="${p.stock}" data-id="${escapeHtml(p.id)}"></td>
            <td><button style="width:auto;padding:6px 12px;margin:0;" data-id="${escapeHtml(p.id)}">Save</button></td>
          </tr>`;
        }
        html += `</tbody></table>`;
        $("stockTable").innerHTML = html;

        $("stockTable").querySelectorAll("button").forEach(btn => {
          btn.onclick = async () => {
            const id = btn.dataset.id;
            const input = $("stockTable").querySelector(`input[data-id="${id}"]`);
            const stock = parseInt(input.value, 10);
            try {
              await api("/admin/stock", {
                method: "POST",
                body: JSON.stringify({ id, stock })
              });
              showMsg($("stockMsg"), "Stock updated", "success");
              setTimeout(() => hideMsg($("stockMsg")), 2000);
            } catch (e) {
              showMsg($("stockMsg"), e.message, "error");
            }
          };
        });
      } catch (e) {
        showMsg($("stockMsg"), e.message, "error");
      }
    }

    // REPAIRS
    async function loadRepairs() {
      try {
        const repairs = await api("/admin/repairs");
        if (!repairs.length) {
          $("repairTable").textContent = "No repair calls yet.";
          return;
        }

        let html = `<table><thead><tr>
          <th>ID</th><th>Customer</th><th>Device</th><th>Status</th><th>Action</th>
        </tr></thead><tbody>`;

        for (const r of repairs) {
          const badgeClass = {
            "Awaiting Accessories": "pending",
            "In Progress": "progress",
            "Ready for Pickup": "ready",
            "Completed": "done",
            "Cancelled": "cancel"
          }[r.status] || "pending";

          html += `<tr>
            <td class="small">${escapeHtml(r.id)}</td>
            <td>${escapeHtml(r.name)}<br><span class="small">${escapeHtml(r.phone)}</span></td>
            <td>${escapeHtml(r.device)}<br><span class="small">${escapeHtml(r.priority)}</span></td>
            <td><span class="badge ${badgeClass}">${escapeHtml(r.status)}</span></td>
            <td>
              <select data-id="${escapeHtml(r.id)}" style="width:auto;min-width:140px;">
                <option value="Awaiting Accessories">Awaiting Accessories</option>
                <option value="In Progress">In Progress</option>
                <option value="Ready for Pickup">Ready for Pickup</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </td>
          </tr>`;
        }
        html += `</tbody></table>`;
        $("repairTable").innerHTML = html;

        // Set current values
        $("repairTable").querySelectorAll("select").forEach(sel => {
          const row = repairs.find(r => r.id === sel.dataset.id);
          if (row) sel.value = row.status;

          sel.onchange = async () => {
            try {
              await api("/admin/status", {
                method: "POST",
                body: JSON.stringify({ id: sel.dataset.id, status: sel.value })
              });
              showMsg($("repairMsg"), "Status updated", "success");
              setTimeout(() => hideMsg($("repairMsg")), 2000);
              loadRepairs();
            } catch (e) {
              showMsg($("repairMsg"), e.message, "error");
            }
          };
        });
      } catch (e) {
        showMsg($("repairMsg"), e.message, "error");
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
