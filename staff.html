<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.workers.dev; img-src 'self' data:;">
  <title>KB Computers – Staff Panel</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
      --accent: #3b82f6; --danger: #ef4444; --success: #22c55e; --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.15rem; margin: 20px 0 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
    input, select, button {
      font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); width: 100%; margin-top: 4px;
    }
    button { background: var(--accent); border: none; cursor: pointer; font-weight: 600; margin-top: 12px; }
    button.secondary { background: var(--border); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row > * { flex: 1; min-width: 120px; }
    .hidden { display: none !important; }
    .msg { padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; }
    .msg.error { background: #7f1d1d; color: #fecaca; }
    .msg.success { background: #14532d; color: #bbf7d0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-weight: 500; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge.pending { background: #422006; color: #fbbf24; }
    .badge.progress { background: #1e3a5f; color: #60a5fa; }
    .badge.ready { background: #14532d; color: #4ade80; }
    .badge.done { background: #1e293b; color: #94a3b8; }
    .badge.cancel { background: #450a0a; color: #f87171; }
    #loginBox { max-width: 360px; margin: 60px auto; }
    .small { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginBox" class="card">
      <h1>Staff Login</h1>
      <p class="small">KB Computers – Repair Status Panel</p>
      <label>Staff Password</label>
      <input type="password" id="password" placeholder="Enter staff password" autocomplete="current-password">
      <button id="loginBtn">Login</button>
      <div id="loginMsg" class="msg hidden"></div>
    </div>

    <div id="dashboard" class="hidden">
      <div class="row" style="margin-bottom:12px;">
        <h1 style="flex:1;">Staff Panel</h1>
        <button class="secondary" id="logoutBtn" style="width:auto;">Logout</button>
      </div>

      <div class="card">
        <h2>Your Name (required when updating)</h2>
        <input id="staffName" placeholder="Enter your name (e.g. Ramesh)" maxlength="60">
        <p class="small" style="margin-top:8px;">This name will be saved when you change any status.</p>
      </div>

      <div class="card">
        <h2>Repair Calls</h2>
        <div id="repairMsg" class="msg hidden"></div>
        <div id="repairTable"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://kb-computers-api.nramsingh93.workers.dev";
    let staffPass = "";
    const $ = (id) => document.getElementById(id);

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg " + type;
      el.classList.remove("hidden");
    }
    function hideMsg(el) { el.classList.add("hidden"); }
    function escapeHtml(str) {
      return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    async function api(path, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        "X-Staff-Password": staffPass,
        ...(options.headers || {})
      };
      const res = await fetch(API_BASE + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    $("loginBtn").onclick = async () => {
      const pass = $("password").value.trim();
      if (!pass) return showMsg($("loginMsg"), "Enter password", "error");
      staffPass = pass;
      try {
        await api("/staff/repairs");
        $("loginBox").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        loadRepairs();
      } catch (e) {
        staffPass = "";
        showMsg($("loginMsg"), "Wrong password", "error");
      }
    };
    $("password").onkeydown = (e) => { if (e.key === "Enter") $("loginBtn").click(); };

    $("logoutBtn").onclick = () => {
      staffPass = "";
      $("dashboard").classList.add("hidden");
      $("loginBox").classList.remove("hidden");
      $("password").value = "";
      $("staffName").value = "";
      hideMsg($("loginMsg"));
    };

    async function loadRepairs() {
      try {
        const repairs = await api("/staff/repairs");
        if (!repairs.length) {
          $("repairTable").textContent = "No repair calls yet.";
          return;
        }
        let html = `<table><thead><tr>
          <th>ID</th><th>Customer</th><th>Device</th><th>Status</th><th>Updated By</th><th>Change</th>
        </tr></thead><tbody>`;
        for (const r of repairs) {
          const badgeClass = {
            "Awaiting Accessories": "pending",
            "In Progress": "progress",
            "Ready for Pickup": "ready",
            "Completed": "done",
            "Cancelled": "cancel"
          }[r.status] || "pending";
          html += `<tr>
            <td class="small">${escapeHtml(r.id)}</td>
            <td>${escapeHtml(r.name)}<br><span class="small">${escapeHtml(r.phone)}</span></td>
            <td>${escapeHtml(r.device)}<br><span class="small">${escapeHtml(r.priority)}</span></td>
            <td><span class="badge ${badgeClass}">${escapeHtml(r.status)}</span></td>
            <td class="small">${escapeHtml(r.updated_by || "-")}</td>
            <td>
              <select data-id="${escapeHtml(r.id)}" style="width:auto;min-width:140px;padding:6px;">
                <option value="Awaiting Accessories">Awaiting Accessories</option>
                <option value="In Progress">In Progress</option>
                <option value="Ready for Pickup">Ready for Pickup</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </td>
          </tr>`;
        }
        html += `</tbody></table>`;
        $("repairTable").innerHTML = html;

        $("repairTable").querySelectorAll("select").forEach(sel => {
          const row = repairs.find(r => r.id === sel.dataset.id);
          if (row) sel.value = row.status;
          sel.onchange = async () => {
            const staffName = $("staffName").value.trim();
            if (staffName.length < 2) {
              showMsg($("repairMsg"), "Please enter your name first", "error");
              loadRepairs();
              return;
            }
            let reason = "";
            if (sel.value === "Cancelled") {
              reason = prompt("Reason for cancellation:");
              if (!reason || reason.trim().length < 3) {
                showMsg($("repairMsg"), "Cancellation requires a reason", "error");
                loadRepairs();
                return;
              }
            }
            try {
              await api("/staff/status", {
                method: "POST",
                body: JSON.stringify({
                  id: sel.dataset.id,
                  status: sel.value,
                  reason,
                  staffName
                })
              });
              showMsg($("repairMsg"), "Status updated by " + staffName, "success");
              setTimeout(() => hideMsg($("repairMsg")), 2500);
              loadRepairs();
            } catch (e) {
              showMsg($("repairMsg"), e.message, "error");
              loadRepairs();
            }
          };
        });
      } catch (e) {
        showMsg($("repairMsg"), e.message, "error");
      }
    }
  </script>
</body>
</html>
